<style>
/* 凪いだ海のように平らな画面。本文は明朝、操作と調整は角ゴシック。強調は題字の字間だけに絞る */
:root{
  --bg:#e8eef0; --paper:#f7fafa; --ink:#1c2a2f; --muted:#56676e; --line:#c7d4d8;
  --accent:#2a6c77; --accent-soft:#d9eaed; --pos:#2a7655; --neg:#b04a36;
  --font-text:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11181b; --paper:#182226; --ink:#e2ecee; --muted:#93a7ae; --line:#2a3a40;
    --accent:#86c5cf; --accent-soft:#1f3338; --pos:#6fcf9f; --neg:#e58a76; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11181b; --paper:#182226; --ink:#e2ecee; --muted:#93a7ae; --line:#2a3a40;
  --accent:#86c5cf; --accent-soft:#1f3338; --pos:#6fcf9f; --neg:#e58a76; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:1.25rem 2rem}
.app{display:grid;grid-template-columns:minmax(0,1fr) 19.5rem;gap:1.25rem;max-width:62rem;margin:0 auto;align-items:start}
@media (max-width:52rem){.app{grid-template-columns:minmax(0,1fr)}}
button{font-family:var(--font-ui);color:var(--ink)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stage{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:1.1rem 1.5rem 1.5rem;min-height:28rem;display:flex;flex-direction:column;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:center;gap:1rem;font-size:.8125rem;color:var(--muted);letter-spacing:.05em;border-bottom:1px solid var(--line);padding-bottom:.7rem;margin-bottom:1.25rem}
.ticks{display:inline-flex;gap:.3rem;margin-right:.6rem;vertical-align:middle}
.tick{width:.55rem;height:.55rem;border-radius:50%;border:1px solid var(--muted)}
.tick.on{background:var(--accent);border-color:var(--accent)}
.lines{display:flex;flex-direction:column;gap:.85rem;flex:1;min-height:6rem}
.ln{display:grid;grid-template-columns:4.2rem minmax(0,1fr);gap:.75rem;font-family:var(--font-text);font-size:1.0625rem;line-height:2;animation:rise .5s ease both}
.ln .sp{font-family:var(--font-ui);font-size:.75rem;letter-spacing:.08em;color:var(--muted);padding-top:.6rem;text-align:right}
.ln .sp.tra{color:var(--accent)} .ln .sp.cat{color:var(--ink);font-weight:700}
.ln .tx{overflow-wrap:anywhere}
body.debug .ln.draft .tx{border-bottom:1px dotted var(--muted)}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ln{animation:none}}
@media (max-width:30rem){.ln{grid-template-columns:3rem minmax(0,1fr);gap:.5rem}.stage{padding-inline:1rem}}

.more{display:flex;justify-content:flex-end;gap:1rem;margin-top:1rem}
.link{background:none;border:0;padding:.3rem .2rem;font-size:.8125rem;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link.go{color:var(--accent);text-decoration:none;font-weight:500}
.choices{margin-top:1.25rem;display:grid;gap:.5rem}
.prompt{font-size:.8125rem;color:var(--muted);letter-spacing:.04em}
.opt{text-align:left;font-size:.9375rem;padding:.7rem .9rem;border:1px solid var(--line);background:transparent;border-radius:4px;display:flex;justify-content:space-between;gap:1rem;cursor:pointer;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.chosen{background:var(--accent-soft);border-color:var(--accent)}
.opt:disabled:not(.chosen){opacity:.45;cursor:default}
.tag{display:none;font-size:.75rem;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
body.debug .tag{display:inline}
.tag.pos{color:var(--pos)} .tag.neg{color:var(--neg)}

.title{text-align:left;padding:2.5rem 0 1rem;display:flex;flex-direction:column;gap:1.25rem;flex:1;justify-content:center}
.title h1{font-family:var(--font-text);font-weight:700;font-size:clamp(2.6rem,9vw,4.2rem);letter-spacing:.35em;margin:0;line-height:1.2;text-wrap:balance}
.title .sub{font-family:var(--font-text);color:var(--muted);letter-spacing:.12em;margin:0}
.title .note{max-width:34rem;color:var(--muted);font-size:.875rem;margin:0}
.start{align-self:flex-start;font-size:1rem;padding:.7rem 1.6rem;background:var(--accent);color:var(--paper);border:0;border-radius:4px;cursor:pointer;letter-spacing:.1em}
:root .start{color:var(--bg)}
.horizon{height:1px;background:var(--line);max-width:34rem}

.end h2{font-family:var(--font-text);font-size:1.6rem;margin:.2rem 0 .3rem;letter-spacing:.12em}
.end .cond{display:none;color:var(--muted);font-size:.875rem;margin:0 0 1rem}
.slots{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0 1.1rem}
.slot{font-size:.8125rem;border:1px solid var(--line);padding:.25rem .6rem;border-radius:3px;color:var(--muted)}

/* タイトル画面：濃紺と金 */
.title{background:#06172c;color:#e9dcc0;border-radius:6px;padding:0 0 1.6rem;gap:1rem;justify-content:flex-start;align-items:center;text-align:center;overflow:hidden}
.title .cover{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;-webkit-mask-image:linear-gradient(#000 90%,transparent);mask-image:linear-gradient(#000 90%,transparent)}
.title .note{color:#b9b49f;margin:.4rem 1.2rem 0}
.title .endlist-h{color:#c9b27a}
.title .slots{justify-content:center}
.title .slot{border-color:#5a4d2c;color:#9c9578;background:transparent}
.title .slot.got{border-color:#d4af6a;color:#f0d9a0;background:#1b2440}
.title .start{align-self:center;background:#d4af6a;color:#031429;font-weight:700;letter-spacing:.3em;padding:.75rem 2.6rem}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0}

/* タイトル画面：16:9の一枚に収める（狭い画面では3:4） */
.title{aspect-ratio:16/9;padding:0;gap:0;flex:none;justify-content:flex-start;align-items:stretch;min-height:0}
.title .cover{aspect-ratio:auto;height:auto;-webkit-mask-image:none;mask-image:none}
.title .foot{flex:1;display:flex;align-items:center;justify-content:center;gap:1.6rem;flex-wrap:wrap;padding:.4rem 1rem;min-height:0}
.title .endlist{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;justify-content:center}
.title .endlist .slots{margin:0}
.title .start{padding:.6rem 2.2rem}
@media (max-width:52rem){
  .title{aspect-ratio:3/4;max-height:calc(100svh - 2.5rem);justify-content:center}
  .title .foot{flex:none;flex-direction:column;gap:1.1rem;padding:1.6rem 1rem 0}
  .title .endlist{flex-direction:column;gap:.5rem}
}
.endlist-h{margin:0;font-size:.8125rem;color:var(--muted);letter-spacing:.1em}
.endlist .slots{margin:.4rem 0 0}
.slot.got{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btns{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.btn{font-size:.9rem;padding:.55rem 1rem;border:1px solid var(--line);background:transparent;border-radius:4px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:.8125rem;width:100%;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:.3rem .5rem;text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:500}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:.9rem 1rem;min-width:0}
.panel summary{cursor:pointer;font-weight:700;font-size:.875rem;letter-spacing:.06em}
.panel h3{font-size:.75rem;font-weight:500;color:var(--muted);letter-spacing:.08em;margin:1.1rem 0 .4rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.8125rem;margin:.3rem 0}
.row input[type=number],.row input[type=text]{width:6.5rem;font:inherit;padding:.25rem .4rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:3px}
.row input[type=text]{width:8rem}
.big{font-size:1.9rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.meter{position:relative;height:10px;background:var(--accent-soft);border-radius:5px;margin:.9rem 0 .35rem}
.fill{position:absolute;top:0;bottom:0}
.fill.pos{background:var(--pos);border-radius:0 5px 5px 0}.fill.neg{background:var(--neg);border-radius:5px 0 0 5px}
.mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.mk.zero{background:var(--muted);opacity:.6}
.mk.thr{background:var(--accent);width:3px}
.scale{display:flex;justify-content:space-between;font-size:.6875rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.chip{font-size:.75rem;border:1px solid var(--line);border-radius:3px;padding:.1rem .45rem;color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.logline{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:.5rem;font-size:.75rem;border-bottom:1px solid var(--line);padding:.25rem 0;font-variant-numeric:tabular-nums}
.logline .p.pos{color:var(--pos)}.logline .p.neg{color:var(--neg)}
.empty{font-size:.75rem;color:var(--muted)}
.hint{font-size:.75rem;color:var(--muted);margin:.5rem 0 0}

/* 画像版: 背景と人物の舞台。画像が無い枠は、色と名前だけの仮表示 */
:root{--phl:84%}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--phl:20%}}
:root[data-theme="dark"]{--phl:20%}
.scene{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;position:sticky;aspect-ratio:16/9;max-height:50vh;width:100%;margin:0 0 1rem;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--accent-soft)}
@media (max-width:52rem){.scene{aspect-ratio:4/3;max-height:42vh}}
.scene .bg,.scene .cast{position:absolute;inset:0}
.bg{opacity:0;transition:opacity .7s ease;background-size:cover;background-position:center bottom;background-repeat:no-repeat}
.bg.on{opacity:1}
.bg.ph{background-image:linear-gradient(180deg,hsl(var(--h) 24% calc(var(--phl) + 5%)),hsl(var(--h) 22% var(--phl)))}
.bg.ph::after{content:attr(data-label);position:absolute;left:.8rem;top:.6rem;font-size:.75rem;letter-spacing:.08em;color:var(--muted)}
.spr{position:absolute;bottom:0;opacity:.72;transition:right .45s ease,opacity .3s ease}
.spr.active{opacity:1}
.spr img{height:100%;width:auto;display:block}
.spr.cat{left:2%;height:34%}
.spr.npc{height:86%}
.spr.npc.s0{right:3%}.spr.npc.s1{right:27%}.spr.npc.s2{right:51%}
.spr.ph{display:flex;align-items:flex-end;justify-content:center;border:1px dashed var(--muted);border-bottom:0;border-radius:45% 45% 0 0;background:color-mix(in srgb,var(--paper) 62%,transparent);color:var(--muted);font-size:.75rem;letter-spacing:.06em;padding:.4rem .6rem}
.spr.npc.ph{aspect-ratio:3/5}
.spr.npc.k_child{height:62%}
.spr.cat.ph{aspect-ratio:1}
@media (prefers-reduced-motion:reduce){.bg,.spr{transition:none}}
.assets summary{cursor:pointer;font-size:.8125rem}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem;font-size:.75rem;border-bottom:1px solid var(--line);padding:.2rem 0}
.arow .ok{color:var(--pos)} .arow .no{color:var(--muted)}
.arow code{font-size:.6875rem;color:var(--muted)}

/* ビジュアルノベル版: 一枚の画面に背景・人物・メッセージ窓を重ねる */
.app{grid-template-columns:minmax(0,1fr)!important;max-width:60rem}
.stage{background:none;border:0;padding:0;min-height:0}
.screen{position:relative;aspect-ratio:16/9;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper);user-select:none;-webkit-user-select:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
@media (max-width:52rem){.screen{aspect-ratio:3/4;max-height:calc(100svh - 2.5rem)}}
.screen .scene{position:absolute;inset:0;aspect-ratio:auto;max-height:none;margin:0;border:0;border-radius:0}
.screen .hd{position:absolute;left:.6rem;right:.6rem;top:.55rem;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:.5rem;border:0;margin:0;padding:0;pointer-events:none}
.screen .hd>span,.screen .logbtn{background:color-mix(in srgb,var(--paper) 82%,transparent);border:1px solid var(--line);border-radius:99px;padding:.12rem .7rem;font-size:.75rem;color:var(--muted);letter-spacing:.06em}
.screen .hd>span:empty{display:none}
.hdr{display:flex;gap:.4rem;align-items:center}
.screen .logbtn{pointer-events:auto;cursor:pointer;font-family:var(--font-ui)}
.screen .logbtn:hover{border-color:var(--accent);color:var(--accent)}
.screen .hd>span,.screen .logbtn{white-space:nowrap}
@media (max-width:30rem){
.screen .hd{flex-wrap:wrap;justify-content:flex-start;gap:.35rem .4rem}
.screen .hd::after{content:"";order:3;flex-basis:100%;height:0}
.hdr{display:contents}
#hdLeft{order:1}#hdRight{order:2;background:color-mix(in srgb,var(--paper) 82%,transparent);border:1px solid var(--line);border-radius:99px;padding:.12rem .7rem;font-size:.75rem;color:var(--muted);letter-spacing:.06em}
.screen .logbtn{order:4;font-size:.7rem;padding:.1rem .55rem;background:color-mix(in srgb,var(--paper) 90%,transparent)}
#skipBtn{margin-left:auto}
#fsBtn{display:none!important}
}
.fade{position:absolute;inset:0;z-index:9;background:#040a16;opacity:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;color:#cdd6de;font-family:var(--font-text);transition:opacity 1.6s ease}
.fade.on{opacity:1;pointer-events:auto}
.fade .fd1,.fade .fd2{opacity:0;transition:opacity .9s ease}
.fade.lab .fd1,.fade.lab .fd2{opacity:1}
.fade .fd1{font-size:1.1rem;letter-spacing:.4em;padding-left:.4em}
.fade .fd2{font-size:.8rem;letter-spacing:.35em;padding-left:.35em;color:#8b98a5}
#gameView:fullscreen,#gameView:-webkit-full-screen{background:#000;display:flex;align-items:center;justify-content:center}
#gameView:fullscreen .screen{width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;max-height:100vh;border:0;border-radius:0}
@media (orientation:portrait){#gameView:fullscreen .screen{width:100vw;height:100vh;aspect-ratio:auto;max-height:none}}
.screen .logbtn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.spr.cat{left:2%;bottom:7.4rem;height:32%}
.spr.npc{height:94%}
.spr img{max-width:62vw;object-fit:contain}
.win{position:absolute;left:.7rem;right:.7rem;bottom:.7rem;z-index:5;min-height:7.6rem;padding:1.35rem 1.6rem 1.2rem;background:color-mix(in srgb,var(--paper) 90%,transparent);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(2px)}
.win .nm{position:absolute;left:1rem;top:-.95rem;padding:.14rem .95rem;background:var(--accent-soft);border:1px solid var(--line);border-radius:4px;font-size:.8125rem;letter-spacing:.14em;color:var(--ink)}
.win .nm:empty{display:none}
.win .nm.tra{color:var(--accent)} .win .nm.cat{font-weight:700}
.win .tx{font-family:var(--font-text);font-size:1.0625rem;line-height:1.95;overflow-wrap:anywhere;padding-right:1rem}
.ind{position:absolute;right:.9rem;bottom:.45rem;color:var(--accent);font-size:.8rem;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.15}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.ind{animation:none}}
.screen .choices{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;justify-content:center;gap:.6rem;margin:0;padding:3rem 9% 10.5rem;background:color-mix(in srgb,var(--bg) 40%,transparent);overflow:auto;cursor:default}
.screen .prompt{align-self:center;background:color-mix(in srgb,var(--paper) 88%,transparent);border:1px solid var(--line);border-radius:99px;padding:.15rem .9rem;color:var(--ink)}
.screen .opt{background:color-mix(in srgb,var(--paper) 94%,transparent);font-family:var(--font-text);font-size:1rem;padding:.8rem 1.1rem}
.screen .opt.chosen{background:var(--accent-soft)}
.logv{position:absolute;inset:0;z-index:8;background:color-mix(in srgb,var(--paper) 97%,transparent);overflow:auto;padding:3.2rem 1.4rem 1.2rem;cursor:default}
.logv .le{display:grid;grid-template-columns:4rem minmax(0,1fr);gap:.7rem;font-family:var(--font-text);font-size:.95rem;line-height:1.85;margin:0 0 .6rem}
.logv .le .n{font-family:var(--font-ui);font-size:.75rem;color:var(--muted);text-align:right;padding-top:.3rem}
.logv .x{position:fixed;position:absolute;right:.8rem;top:.6rem;z-index:9}
.screen .end{position:absolute;inset:0;z-index:7;background:color-mix(in srgb,var(--paper) 93%,transparent);padding:1.6rem 1.8rem;overflow:auto;cursor:default}
@media (max-width:30rem){.win{padding:1.3rem 1.1rem 1.1rem;min-height:8.4rem}.win .tx{font-size:1rem}.spr.cat{bottom:8.4rem}.screen .choices{padding-inline:5%}}
/* スマホ横画面: 高さに収まる16:9で表示 */
@media (orientation:landscape) and (max-height:34rem){
body{padding-block:.3rem}
.stage{padding:0;border:0;min-height:0;background:none}
.screen,.title{aspect-ratio:16/9;width:min(100%,calc((100svh - .8rem)*16/9));max-height:calc(100svh - .8rem);margin-inline:auto}
.title{padding:0;gap:.3rem;justify-content:flex-start}
.title .cover{height:auto;max-height:56%;object-fit:contain}
.title .note{display:none}
.title .foot{flex:none;flex-direction:row;gap:.3rem .8rem;padding:.2rem 1rem 0;align-items:center;justify-content:center;flex-wrap:wrap}
.title .endlist{flex-direction:row;gap:.5rem}
.title .start{padding:.35rem 1.6rem;font-size:.85rem}
.lhint{display:block!important}
.screen .hd{left:.45rem;right:.45rem;top:.4rem;flex-wrap:nowrap;justify-content:flex-start;gap:.3rem}
.screen .hd::after{display:none}
.hdr{display:contents}
#hdLeft{order:1}
#hdRight{order:2;margin-right:auto;background:color-mix(in srgb,var(--paper) 88%,transparent);border:1px solid var(--line);border-radius:99px;padding:.05rem .5rem;font-size:.65rem;color:var(--muted)}
.screen .hd>span,.screen .logbtn{font-size:.65rem;padding:.04rem .5rem;letter-spacing:.04em}
.screen .logbtn{order:3;background:color-mix(in srgb,var(--paper) 90%,transparent)}
#skipBtn{margin-left:0}
#fsBtn{border-color:var(--accent);color:var(--accent)}
.win{left:.5rem;right:.5rem;bottom:.45rem;padding:.55rem .9rem .45rem;min-height:3.9rem}
.win .nm{top:-.75rem;left:.7rem;font-size:.68rem;padding:.06rem .6rem}
.win .tx{font-size:.8rem;line-height:1.6;padding-right:.8rem}
.spr.cat{bottom:4.4rem}
.screen .choices{padding-inline:3%;gap:.3rem}

}

function imgSrc(f){return (f.charAt(0)==='/'||/^https?:/.test(f))?f:'img/'+f}
function paintBg(node,key){
  var file=IMG.bg[key];

function makeSprite(k){

function syncCast(){
  var c=$('cast'),want=['cat'].concat(VIS.npcs);
  Object.keys(VIS.nodes).forEach(function(k){if(want.indexOf(k)<0){c.removeChild(VIS.nodes[k]);delete VIS.nodes[k]}});
  want.forEach(function(k){
    var d=VIS.nodes[k];
    if(!d){d=makeSprite(k);VIS.nodes[k]=d;c.appendChild(d)}

    VIS.npcs.push(k);
    if(VIS.npcs.length>3){var drop=VIS.npcs.filter(function(x){return x!==k})[0];VIS.npcs.splice(VIS.npcs.indexOf(drop),1)}
  }
  VIS.active=k;syncCast();
}
function drain(){
  while(Q&&Q.i<Q.lines.length&&String(Q.lines[Q.i][0]).charAt(0)==='@'){
    var r=Q.lines[Q.i++];
    if(r[0]==='@bg')setBg(r[1]);
    else if(r[0]==='@day'){var q=Q;dayBreak(r[1],function(){setBg(r[2]);if(r[1]===4){lastT=[0,'朝'];header(lastT)}},function(){if(Q===q)nextLine()});return true}
    else if(r[0]==='@join'){r.slice(1).forEach(function(k){if(VIS.npcs.indexOf(k)<0)VIS.npcs.push(k)});syncCast()}
    else if(r[0]==='@clear'){VIS.npcs.length=0;VIS.active=null;syncCast()}
    else if(r[0]==='@leave'){var ix=VIS.npcs.indexOf(r[1]);if(ix>=0){VIS.npcs.splice(ix,1);if(VIS.active===r[1])VIS.active=null;syncCast()}}
  }
}

/* 日の区切りの暗転：BGMを絞る→暗転→日数表示→背景を替えて→フェードイン→BGMが戻る */
var DAY={busy:false,hold:false,pend:null};
function dayBreak(n,mid,done,opt){
  opt=opt||{};
  var FM=REDUCE?300:1600,HM=REDUCE?900:2300;if(opt.place){FM=REDUCE?200:500;HM=REDUCE?500:1100}if(SKIP.on){FM=Math.min(FM,350);HM=Math.min(HM,opt.place?400:700)}
  DAY.busy=true;
  var f=$('fade');$('fadeD').textContent=opt.place?opt.place:'滞在 '+n+'日目';$('fadeT').textContent=opt.place?'':(opt.time||'朝');
  if(!opt.black){f.style.transition='opacity '+FM+'ms ease';if(AUD.a&&!AUD.muted&&!opt.place)bgmFade(AUD.a,0,FM);f.classList.add('on')}
  setTimeout(function(){
    DAY.hold=true;DAY.pend=null;
    stopTyping();wait=null;$('msgText').textContent='';$('msgName').textContent='';$('ind').hidden=true;
    if(mid)mid();
    f.classList.add('lab');
    setTimeout(function(){
      f.classList.remove('lab');
      setTimeout(function(){
        DAY.hold=false;
        var before=AUD.cur;
        if(DAY.pend)bgmPlay(DAY.pend);
        DAY.pend=null;
        if(AUD.cur===before&&AUD.a&&!AUD.muted){var a=AUD.a;try{if(a.paused){var pr=a.play();if(pr&&pr.catch)pr.catch(function(){})}}catch(e){}bgmFade(a,AUD.vol,FM)}
        f.style.transition='opacity '+FM+'ms ease';
        f.classList.remove('on');
        DAY.busy=false;
        if(done)done();
      },600);
    },HM);
  },opt.black?250:FM+250);
}

/* 音楽。曲が届いたら、ここにファイル名を入れる（null の曲は、いま流れている曲をそのまま続ける） */
var BGM={gate:'bgm_gate.mp3',town:'bgm_town.mp3',walk:'bgm_walk.mp3',home:'bgm_home.mp3',night:'bgm_night.mp3',eve:'bgm_eve.mp3',endA:'bgm_end_a.mp3',endB:'bgm_end_b.mp3',trueEnd:'bgm_true.mp3'};
var BGMSCENE={arrive:'gate',d1pick:'town',plaza:'town',cafe:'town',alley:'walk',d1night:'night',d2inn:'town',p_school:'town',d2pick:'town',p_park:'walk',p_library:'walk',p_history:'walk',d2walk:'walk',d2home:'home',d2night:'night',d3pick:'walk',d3bench:'walk',d3walk:'walk',d3night:'eve',past:'eve',q2:'eve',e1:'endA',e2:'endA',e3:'endB',e4:'endB',e5:'trueEnd'};
var AUD={cur:null,a:null,muted:false,vol:0.3};
try{var _v=parseFloat(localStorage.getItem('kofuku-vol'));if(_v>=0&&_v<=1)AUD.vol=_v}catch(e){}
try{AUD.muted=localStorage.getItem('kofuku-mute')==='1'}catch(e){}
function bgmFade(a,to,ms,done){
  var from=a.volume,t0=Date.now();
  (function step(){var p=Math.min(1,(Date.now()-t0)/ms);try{a.volume=Math.max(0,Math.min(1,from+(to-from)*p))}catch(e){}
    if(p<1)setTimeout(step,50);else if(done)done()})();
}
function bgmPlay(key){
  var f=BGM[key];if(!f||AUD.cur===key)return;
  AUD.cur=key;
  var old=AUD.a,a=new Audio('audio/'+f);a.loop=true;a.volume=0;AUD.a=a;
  if(!AUD.muted){var pr=a.play();if(pr&&pr.catch)pr.catch(function(){})}
  bgmFade(a,AUD.muted?0:AUD.vol,1500);
  if(old)bgmFade(old,0,1500,function(){old.pause()});
}
function renderMute(){var b=$('muteBtn');if(b)b.textContent=AUD.muted?'音 OFF':'音 ON'}
function toggleMute(){
  AUD.muted=!AUD.muted;
  try{localStorage.setItem('kofuku-mute',AUD.muted?'1':'0')}catch(e){}
  var a=AUD.a;
  if(a){
    if(AUD.muted)bgmFade(a,0,300,function(){if(AUD.muted)a.pause()});
    else{var p=a.play();if(p&&p.catch)p.catch(function(){});bgmFade(a,AUD.vol,600)}
  }
  renderMute();
}

  var b=$('skipBtn');if(b){b.classList.toggle('on',SKIP.on);b.textContent=SKIP.on?'スキップ中':'スキップ'}

  else if(SKIP.on&&Q&&wait==='line'&&!T.typing&&!DAY.busy)queueSkip();
}
function queueSkip(){
  if(SKIP.t)clearTimeout(SKIP.t);

function tick(){
  T.timer=0;
  if(T.pos<T.full.length)T.pos++;
  $('msgText').textContent=T.full.slice(0,T.pos);
  if(T.pos>=T.full.length){T.typing=false;onTyped();return}
  var ch=T.full.charAt(T.pos-1);
  T.timer=setTimeout(tick,(ch==='。'||ch==='！'||ch==='？')?170:(ch==='、'||ch==='…'||ch==='―')?90:30);
}
function stopTyping(){if(T.timer){clearTimeout(T.timer);T.timer=0}T.typing=false}

function hasMore(){for(var j=Q.i;j<Q.lines.length;j++)if(String(Q.lines[j][0]).charAt(0)!=='@')return true;return false}
function onTyped(){
  if(!Q)return;
  if(!hasMore()&&Q.imm){drain();finishQ();return}
  wait='line';$('ind').hidden=false;
  if(SKIP.on&&!DAY.busy)queueSkip();
}
function finishQ(){var d=Q.done;Q=null;wait=null;$('ind').hidden=true;if(d)d()}

  if(!Q)return;
  if(drain())return;
  if(Q.i>=Q.lines.length){finishQ();return}
  addLine(Q.lines[Q.i++]);
}

  if(DAY.busy)return;

      var rs=typeof o.res==='function'?o.res():o.res;if(rs&&rs.length){play(rs,function(){after(o)})}else after(o);
    });
    box.appendChild(b);btns.push(b);
  });
}
function showCont(nx){pendingNext=nx;goNext()}
function goNext(){
  var nx=pendingNext;pendingNext=null;
  if(typeof nx==='function')nx=nx();
  if(nx)go(nx);
}

function go(id){
  var sc=SC[id];
  if(sc.dayBreak&&S.scene&&!DAY.busy){dayBreak(sc.dayBreak,function(){enterGo(id)},function(){runStep(sc,0)});return}
  if(sc.place&&S.scene&&!DAY.busy){dayBreak(0,function(){enterGo(id)},function(){runStep(sc,0)},{place:sc.place});return}
  enterGo(id);runStep(sc,0);
}
function enterGo(id){
  var sc=SC[id];S.scene=id;saveRead();
  Q=null;pendingNext=null;
  stopTyping();wait=null;$('msgText').textContent='';$('msgName').textContent='';$('choices').hidden=true;$('ind').hidden=true;
  if(sc.t[0]!==null)lastT=sc.t;
  header(lastT);
  enterScene(id);
  if(sc.enter)sc.enter();
  renderPanel();
}
var lastT=[1,'昼'];
function goTo(nx){if(typeof nx==='function')nx=nx();if(nx)go(nx)}
function runStep(sc,i){
  var st=sc.steps[i];
  if(st.enter)st.enter();
  var lines=typeof st.lines==='function'?st.lines():st.lines;
  if(i>0){clear($('choices'))}
  var imm=false;
  play(lines,function(){
    var proceed=function(){
      if(i+1<sc.steps.length)return runStep(sc,i+1);
      if(sc.ending)return showEnd(sc.ending);
      if(sc.next!==undefined)showCont(sc.next);
    };
    if(!st.choice)return proceed();
    showChoice(st.choice,function(o){
      if(o.next!==undefined){
        if(typeof o.res==='function'||(o.res&&o.res.length))return showCont(o.next);
        return goTo(o.next);
      }
      proceed();
    });
  },imm);
}

/* エンディング画面 */
function reached(){try{return JSON.parse(localStorage.getItem('kofuku-endings')||'[]')}catch(e){return[]}}
function remember(k){try{var r=reached();if(r.indexOf(k)<0){r.push(k);localStorage.setItem('kofuku-endings',JSON.stringify(r))}}catch(e){}}
function fillSlots(box){
  clear(box);var got=reached();
  Object.keys(ENDINGS).forEach(function(x){var on=got.indexOf(x)>=0;box.appendChild(el('span','slot'+(on?' got':''),ENDINGS[x].no+' '+(on?ENDINGS[x].name:'？？？')))});
}
function showEnd(k){
  var e=ENDINGS[k];remember(k);S.ended=k;setSkip(false);saveRead();
  var v=$('endView');clear(v);
  $('gameView').hidden=false;
  var wrap=el('div','');
  wrap.appendChild(el('h2','','エンディング '+e.no+'　'+e.name));
  var hi=S.gauge>=cfg.threshold;
  wrap.appendChild(el('p','cond',(S.vacc?'接種する':'接種しない')+'　／　ゲージ '+(S.gauge>0?'+':'')+S.gauge+'（しきい値 +'+cfg.threshold+'で'+(hi?'言葉を持てた':'届かず')+'）　／　祖父フラグ '+(S.grand?'有':'無')));
  var slots=el('div','slots');fillSlots(slots);
  wrap.appendChild(slots);
  var btns=el('div','btns');
  var b1=el('button','btn','最初からやり直す');b1.type='button';b1.addEventListener('click',startGame);
  var b2=el('button','btn','タイトルに戻る');b2.type='button';b2.addEventListener('click',toTitle);
  btns.appendChild(b2);btns.appendChild(b1);wrap.appendChild(btns);
  v.appendChild(wrap);v.hidden=false;
  $('ind').hidden=true;$('choices').hidden=true;wait=null;
}

function toTitle(){
  if(DAY.busy)return;
  setSkip(false);
  try{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}
  var old=AUD.a;AUD.cur=null;AUD.a=null;
  if(old)bgmFade(old,0,700,function(){try{old.pause()}catch(e){}});
  $('endView').hidden=true;$('gameView').hidden=true;
  fillSlots($('titleSlots'));
  var tv=$('titleView');tv.style.opacity='';tv.style.transition='';tv.hidden=false;
}

/* パネル */
function renderPanel(){
  if(!S)return;
  var g=S.gauge;
  var box=$('gaugeBox');clear(box);
  var big=el('div','big',(g>0?'+':'')+g);box.appendChild(big);
  var m=el('div','meter');
  var z=(0-MIN)/(MAX-MIN)*100,pos=(Math.max(MIN,Math.min(MAX,g))-MIN)/(MAX-MIN)*100;
  var f=el('div','fill '+(g>=0?'pos':'neg'));
  if(g>=0){f.style.left=z+'%';f.style.width=(pos-z)+'%'}else{f.style.left=pos+'%';f.style.width=(z-pos)+'%'}
  m.appendChild(f);
  var mz=el('div','mk zero');mz.style.left=z+'%';m.appendChild(mz);
  var th=el('div','mk thr');th.style.left=((Math.max(MIN,Math.min(MAX,cfg.threshold))-MIN)/(MAX-MIN)*100)+'%';m.appendChild(th);
  box.appendChild(m);
  var sc=el('div','scale');sc.appendChild(el('span','',String(MIN)));sc.appendChild(el('span','','0'));sc.appendChild(el('span','','+'+MAX));box.appendChild(sc);

  var fl=$('flagBox');clear(fl);
  fl.appendChild(el('span','chip'+(S.grand?' on':''),'祖父フラグ '+(S.grand?'有':'無')));
  Object.keys(PLACES).forEach(function(k){fl.appendChild(el('span','chip'+(S.visited.indexOf(k)>=0?' on':''),PLACES[k].chip))});
  if(S.vacc!==null)fl.appendChild(el('span','chip on',S.vacc?'接種する':'接種しない'));

  var lb=$('logBox');clear(lb);
  if(!S.log.length){lb.appendChild(el('div','empty','まだありません'))}
  S.log.forEach(function(r){
    var row=el('div','logline');
    row.appendChild(el('span','',r.n+'　'+r.t));
    row.appendChild(el('span','p'+(r.p>0?' pos':(r.p<0?' neg':'')),r.note?'':((r.p>0?'+':'')+r.p)));
    row.appendChild(el('span','',r.note?'':'計'+r.tot));
    lb.appendChild(row);
  });
}

function startGame(){
  if(DAY.busy)return;
  fresh();setSkip(false);lastT=[1,'昼'];LOGV.length=0;DAY.hold=false;DAY.pend=null;$('fade').classList.remove('lab');
  var tv=$('titleView'),wasTitle=!tv.hidden;
  DAY.busy=true;
  function begin(){
    tv.hidden=true;tv.style.opacity='';tv.style.transition='';
    $('endView').hidden=true;$('gameView').hidden=false;
    var f=$('fade');f.style.transition='none';f.classList.add('on');void f.offsetWidth;
    dayBreak(1,function(){enterGo('arrive')},function(){runStep(SC.arrive,0)},{time:'昼',black:true});
  }
  if(wasTitle){tv.style.transition='opacity .7s';tv.style.opacity='0';setTimeout(begin,REDUCE?0:700)}else begin();
}

/* 入力 */
fillSlots($('titleSlots'));
$('startBtn').addEventListener('click',startGame);
$('screen').addEventListener('click',function(e){
  if(e.target.closest('button,input,a,.logv,.end'))return;advance();
});
$('logBtn').addEventListener('click',openLog);
$('muteBtn').addEventListener('click',toggleMute);renderMute();
$('skipBtn').addEventListener('click',function(e){e.stopPropagation();setSkip(!SKIP.on)});
(function(){
  var gv=$('gameView'),fb=$('fsBtn');
  var can=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
  if(!can)return;
  fb.hidden=false;
  function cur(){return document.fullscreenElement||document.webkitFullscreenElement}
  function sync(){fb.textContent=cur()?'全画面を解除':'全画面'}
  fb.addEventListener('click',function(e){
    e.stopPropagation();
    try{
      if(cur()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
      else{var r=(gv.requestFullscreen||gv.webkitRequestFullscreen).call(gv);if(r&&r.catch)r.catch(function(){fb.hidden=true})}
    }catch(err){fb.hidden=true}
  });
  document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync);
  sync();
})();
$('logClose').addEventListener('click',function(){$('logv').hidden=true});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){$('logv').hidden=true;return}
  if(e.key!=='Enter'&&e.key!==' ')return;
  var t=e.target.tagName;if(t==='BUTTON'||t==='INPUT'||t==='SUMMARY'||t==='A')return;
  if(!$('gameView').hidden&&$('logv').hidden&&$('endView').hidden){e.preventDefault();advance()}
});
$('dbg').addEventListener('change',function(){document.body.classList.toggle('debug',$('dbg').checked)});
function num(id,min,max,key){
  $(id).addEventListener('input',function(){
    var v=parseInt($(id).value,10);if(isNaN(v))return;cfg[key]=Math.max(min,Math.min(max,v));renderPanel();
  });
}
num('thr',MIN,MAX,'threshold');
$('vol').value=Math.round(AUD.vol*100);
$('vol').addEventListener('input',function(){
  AUD.vol=parseInt($('vol').value,10)/100;
  try{localStorage.setItem('kofuku-vol',String(AUD.vol))}catch(e){}
  if(AUD.a&&!AUD.muted&&!DAY.busy)try{AUD.a.volume=AUD.vol}catch(e){}
});
$('nm').addEventListener('input',function(){cfg.name=$('nm').value||'アルテ'});
$('gsetBtn').addEventListener('click',function(){
  if(!S)return;var v=parseInt($('gset').value,10);if(isNaN(v))return;S.gauge=Math.max(MIN,Math.min(MAX,v));renderPanel();
});
if(window.innerWidth<832)$('panel').open=false;
fresh();renderPanel();renderAssets();
setBg('gate');syncCast();
})();
</script>
